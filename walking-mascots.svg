<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 205" width="800" height="205" role="img" aria-label="Language mascots walking / Mascotes das linguagens andando">
  <style>
    .walker { animation: walk 24s linear infinite; }
    .bob    { animation: bob .5s ease-in-out infinite alternate; }
    .hop    { animation: hop .45s ease-in-out infinite alternate; }
    .leg    { transform-box: fill-box; transform-origin: top center; animation: swing .5s ease-in-out infinite alternate; }
    .leg.b  { animation-direction: alternate-reverse; }
    .seg    { animation: slither .6s ease-in-out infinite alternate; }
    .steam  { animation: steam 1.6s ease-out infinite; }
    .tongue { transform-box: fill-box; transform-origin: left center; animation: flick 1.2s steps(2) infinite; }
    .blink  { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }

    @keyframes walk    { from { transform: translateX(-120px); } to { transform: translateX(920px); } }
    @keyframes bob     { from { transform: translateY(0); } to { transform: translateY(-3px); } }
    @keyframes hop     { from { transform: translateY(0); } to { transform: translateY(-9px); } }
    @keyframes swing   { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
    @keyframes slither { from { transform: translateY(0); } to { transform: translateY(-7px); } }
    @keyframes steam   { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: .8; } 100% { opacity: 0; transform: translateY(-14px); } }
    @keyframes flick   { 0% { transform: scaleX(1); } 50% { transform: scaleX(0); } }
    @keyframes blink   { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

    .talk   { opacity: 0; transform-box: fill-box; transform-origin: bottom center; animation: talk 8s ease-out infinite; }
    .code   { font: bold 9.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .name   { font: 600 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    @keyframes talk { 0%, 10% { opacity: 0; transform: scale(.4) translateY(6px); } 15%, 50% { opacity: 1; transform: scale(1); } 55%, 100% { opacity: 0; transform: scale(.9); } }

    @media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; } }
  </style>

  <g transform="translate(0,40)">
  <!-- chão -->
  <line x1="0" y1="141" x2="800" y2="141" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 8" opacity=".6"/>

  <!-- ☕ Java: xícara de café -->
  <g class="walker" style="animation-delay:0s">
    <g transform="translate(0,140)"><g class="talk" style="animation-delay:0s"><rect x="-79.8" y="-108" width="159.6" height="18" rx="6" fill="#ffffff" stroke="#30363d" stroke-width="1.2"/><polygon points="-4,-90.6 4,-90.6 0,-84" fill="#ffffff"/><polyline points="-4,-90 0,-84 4,-90" fill="none" stroke="#30363d" stroke-width="1.2"/><text x="0" y="-95.5" text-anchor="middle" class="code"><tspan fill="#0550ae">System</tspan><tspan fill="#24292f">.out.</tspan><tspan fill="#8250df">println</tspan><tspan fill="#24292f">(</tspan><tspan fill="#0a7d32">&quot;Hi!&quot;</tspan><tspan fill="#24292f">);</tspan></text></g><text x="0" y="16" text-anchor="middle" class="name">Java</text>
      <line class="leg"   x1="-8" y1="-15" x2="-8" y2="0" stroke="#5b3a10" stroke-width="4" stroke-linecap="round"/>
      <line class="leg b" x1="8"  y1="-15" x2="8"  y2="0" stroke="#5b3a10" stroke-width="4" stroke-linecap="round"/>
      <g class="bob">
        <path class="steam" d="M-6,-58 q-4,-6 0,-12 q4,-6 0,-12" fill="none" stroke="#8b949e" stroke-width="2.5" stroke-linecap="round"/>
        <path class="steam" style="animation-delay:.8s" d="M6,-58 q-4,-6 0,-12 q4,-6 0,-12" fill="none" stroke="#8b949e" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M20,-44 a9,9 0 1,1 0,18" fill="none" stroke="#b07219" stroke-width="5"/>
        <path d="M-21,-52 L21,-52 L16,-14 L-16,-14 Z" fill="#b07219"/>
        <ellipse cx="0" cy="-52" rx="21" ry="4" fill="#5b3a10"/>
        <g class="blink"><circle cx="-7" cy="-36" r="4" fill="#fff"/><circle cx="7" cy="-36" r="4" fill="#fff"/>
        <circle cx="-6" cy="-36" r="2" fill="#1b1b1b"/><circle cx="8" cy="-36" r="2" fill="#1b1b1b"/></g>
        <path d="M-5,-27 q5,4 10,0" fill="none" stroke="#5b3a10" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- 🐍 Python: cobrinha -->
  <g class="walker" style="animation-delay:-4s">
    <g transform="translate(0,140)"><g class="talk" style="animation-delay:-1.3s"><rect x="-40.6" y="-44" width="81.2" height="18" rx="6" fill="#ffffff" stroke="#30363d" stroke-width="1.2"/><polygon points="-4,-26.6 4,-26.6 0,-20" fill="#ffffff"/><polyline points="-4,-26 0,-20 4,-26" fill="none" stroke="#30363d" stroke-width="1.2"/><text x="0" y="-31.5" text-anchor="middle" class="code"><tspan fill="#8250df">print</tspan><tspan fill="#24292f">(</tspan><tspan fill="#0a7d32">&quot;Hi!&quot;</tspan><tspan fill="#24292f">)</tspan></text></g><text x="0" y="16" text-anchor="middle" class="name">Python</text><g transform="translate(0,-8)">
      <circle class="seg" style="animation-delay:-.5s" cx="-36" cy="0" r="5"  fill="#ffd43b"/>
      <circle class="seg" style="animation-delay:-.4s" cx="-27" cy="0" r="6.5" fill="#3776ab"/>
      <circle class="seg" style="animation-delay:-.3s" cx="-16" cy="0" r="7.5" fill="#ffd43b"/>
      <circle class="seg" style="animation-delay:-.2s" cx="-4"  cy="0" r="8"  fill="#3776ab"/>
      <circle class="seg" style="animation-delay:-.1s" cx="8"   cy="0" r="8"  fill="#ffd43b"/>
      <g class="seg">
        <path class="tongue" d="M31,-3 h8 l3,-3 M39,-3 l3,3" fill="none" stroke="#e5484d" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="21" cy="-3" rx="12" ry="10" fill="#3776ab"/>
        <g class="blink"><circle cx="24" cy="-7" r="3.5" fill="#fff"/><circle cx="25" cy="-7" r="1.8" fill="#1b1b1b"/></g>
      </g>
    </g></g>
  </g>

  <!-- 💎 Ruby: gema pulando -->
  <g class="walker" style="animation-delay:-8s">
    <g transform="translate(0,140)"><g class="talk" style="animation-delay:-2.6s"><rect x="-35.0" y="-84" width="70.0" height="18" rx="6" fill="#ffffff" stroke="#30363d" stroke-width="1.2"/><polygon points="-4,-66.6 4,-66.6 0,-60" fill="#ffffff"/><polyline points="-4,-66 0,-60 4,-66" fill="none" stroke="#30363d" stroke-width="1.2"/><text x="0" y="-71.5" text-anchor="middle" class="code"><tspan fill="#8250df">puts </tspan><tspan fill="#0a7d32">&quot;Hi!&quot;</tspan></text></g><text x="0" y="16" text-anchor="middle" class="name">Ruby</text>
      <g class="hop">
        <line class="leg"   x1="-7" y1="-14" x2="-7" y2="0" stroke="#7a0f0f" stroke-width="4" stroke-linecap="round"/>
        <line class="leg b" x1="7"  y1="-14" x2="7"  y2="0" stroke="#7a0f0f" stroke-width="4" stroke-linecap="round"/>
        <polygon points="-14,-50 14,-50 25,-38 0,-12 -25,-38" fill="#cc342d"/>
        <polyline points="-25,-38 25,-38" stroke="#ff7b72" stroke-width="1.5"/>
        <polyline points="-14,-50 -8,-38 0,-12 8,-38 14,-50" fill="none" stroke="#ff7b72" stroke-width="1.5"/>
        <g class="blink"><circle cx="-6" cy="-31" r="3.5" fill="#fff"/><circle cx="6" cy="-31" r="3.5" fill="#fff"/>
        <circle cx="-5" cy="-31" r="1.8" fill="#1b1b1b"/><circle cx="7" cy="-31" r="1.8" fill="#1b1b1b"/></g>
      </g>
    </g>
  </g>

  <!-- 🤖 C: robozinho -->
  <g class="walker" style="animation-delay:-12s">
    <g transform="translate(0,140)"><g class="talk" style="animation-delay:-4s"><rect x="-51.8" y="-98" width="103.6" height="18" rx="6" fill="#ffffff" stroke="#30363d" stroke-width="1.2"/><polygon points="-4,-80.6 4,-80.6 0,-74" fill="#ffffff"/><polyline points="-4,-80 0,-74 4,-80" fill="none" stroke="#30363d" stroke-width="1.2"/><text x="0" y="-85.5" text-anchor="middle" class="code"><tspan fill="#8250df">printf</tspan><tspan fill="#24292f">(</tspan><tspan fill="#0a7d32">&quot;Hi!\n&quot;</tspan><tspan fill="#24292f">);</tspan></text></g><text x="0" y="16" text-anchor="middle" class="name">C</text>
      <line class="leg"   x1="-9" y1="-15" x2="-9" y2="0" stroke="#3b4a6b" stroke-width="4" stroke-linecap="round"/>
      <line class="leg b" x1="9"  y1="-15" x2="9"  y2="0" stroke="#3b4a6b" stroke-width="4" stroke-linecap="round"/>
      <g class="bob">
        <line x1="0" y1="-56" x2="0" y2="-66" stroke="#3b4a6b" stroke-width="2.5"/>
        <circle cx="0" cy="-68" r="3.5" fill="#f2c94c"/>
        <rect x="-20" y="-56" width="40" height="42" rx="8" fill="#659ad2"/>
        <text x="0" y="-25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#fff">C</text>
        <g class="blink"><rect x="-12" y="-50" width="7" height="6" rx="2" fill="#fff"/><rect x="5" y="-50" width="7" height="6" rx="2" fill="#fff"/></g>
      </g>
    </g>
  </g>

  <!-- 🐘 PostgreSQL: elefantinho -->
  <g class="walker" style="animation-delay:-16s">
    <g transform="translate(0,140)"><g class="talk" style="animation-delay:-5.3s"><rect x="-43.4" y="-78" width="86.8" height="18" rx="6" fill="#ffffff" stroke="#30363d" stroke-width="1.2"/><polygon points="-4,-60.6 4,-60.6 0,-54" fill="#ffffff"/><polyline points="-4,-60 0,-54 4,-60" fill="none" stroke="#30363d" stroke-width="1.2"/><text x="0" y="-65.5" text-anchor="middle" class="code"><tspan fill="#cf222e">SELECT </tspan><tspan fill="#0a7d32">'Hi!'</tspan><tspan fill="#24292f">;</tspan></text></g><text x="0" y="16" text-anchor="middle" class="name">PostgreSQL</text>
      <line class="leg"   x1="-16" y1="-16" x2="-16" y2="0" stroke="#24486b" stroke-width="6" stroke-linecap="round"/>
      <line class="leg b" x1="-6"  y1="-16" x2="-6"  y2="0" stroke="#24486b" stroke-width="6" stroke-linecap="round"/>
      <line class="leg b" x1="6"   y1="-16" x2="6"   y2="0" stroke="#24486b" stroke-width="6" stroke-linecap="round"/>
      <line class="leg"   x1="15"  y1="-16" x2="15"  y2="0" stroke="#24486b" stroke-width="6" stroke-linecap="round"/>
      <g class="bob">
        <ellipse cx="0" cy="-28" rx="25" ry="16" fill="#336791"/>
        <path d="M34,-34 q10,6 6,20 q-1,4 3,4" fill="none" stroke="#336791" stroke-width="7" stroke-linecap="round"/>
        <circle cx="24" cy="-38" r="13" fill="#336791"/>
        <ellipse cx="16" cy="-36" rx="8" ry="10" fill="#4f86b8"/>
        <g class="blink"><circle cx="28" cy="-42" r="3" fill="#fff"/><circle cx="29" cy="-42" r="1.6" fill="#1b1b1b"/></g>
      </g>
    </g>
  </g>

  <!-- 🛢️ MySQL: banco de dados -->
  <g class="walker" style="animation-delay:-20s">
    <g transform="translate(0,140)"><g class="talk" style="animation-delay:-6.6s"><rect x="-49.0" y="-84" width="98.0" height="18" rx="6" fill="#ffffff" stroke="#30363d" stroke-width="1.2"/><polygon points="-4,-66.6 4,-66.6 0,-60" fill="#ffffff"/><polyline points="-4,-66 0,-60 4,-66" fill="none" stroke="#30363d" stroke-width="1.2"/><text x="0" y="-71.5" text-anchor="middle" class="code"><tspan fill="#cf222e">SHOW </tspan><tspan fill="#cf222e">DATABASES</tspan><tspan fill="#24292f">;</tspan></text></g><text x="0" y="16" text-anchor="middle" class="name">MySQL</text>
      <line class="leg"   x1="-8" y1="-15" x2="-8" y2="0" stroke="#00586b" stroke-width="4" stroke-linecap="round"/>
      <line class="leg b" x1="8"  y1="-15" x2="8"  y2="0" stroke="#00586b" stroke-width="4" stroke-linecap="round"/>
      <g class="bob">
        <path d="M-19,-50 v32 a19,6 0 0,0 38,0 v-32" fill="#00758f"/>
        <path d="M-19,-38 a19,6 0 0,0 38,0 M-19,-27 a19,6 0 0,0 38,0" fill="none" stroke="#f29111" stroke-width="2"/>
        <ellipse cx="0" cy="-50" rx="19" ry="6" fill="#00a0c0"/>
        <g class="blink"><circle cx="-6" cy="-32" r="3.5" fill="#fff"/><circle cx="6" cy="-32" r="3.5" fill="#fff"/>
        <circle cx="-5" cy="-32" r="1.8" fill="#1b1b1b"/><circle cx="7" cy="-32" r="1.8" fill="#1b1b1b"/></g>
      </g>
    </g>
  </g>
</g>
</svg>
